services:
  mongo:
    image: mongo:7
    container_name: ref_mongo
    restart: unless-stopped
    env_file:
      - ./env
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongodata:/data/db
      - ./db-confs/mongod.conf:/etc/mongod.conf
    command: ["mongod", "--config", "/etc/mongod.conf"]
    networks:
      - app-network

  mongo-express:
    image: mongo-express:latest
    container_name: ref_mongo_express
    restart: unless-stopped
    env_file:
      - ./env
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    networks:
      - app-network

  ref_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ref_api
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      PYTHONPATH: /app
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    working_dir: /app
    volumes:
      - ./backend:/app
    networks:
      - app-network

  app:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ref_dashboard
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      PYTHONPATH: /app
      API_KEY: ${API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      - mongo
      - ref_api
    working_dir: /app
    volumes:
      - ./dashboard:/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge